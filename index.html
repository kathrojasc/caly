<style>
  :root {
    --bg: #F6F5FB;
    --surface: #FFFFFF;
    --surface-alt: #EDEBF8;
    --border: rgba(23,19,49,0.12);
    --ink: #171331;

    --success: #2F8F6B;
    --success-soft: #E1F3EC;
    --warning: #B87A1F;
    --warning-soft: #FBEDD9;
    --danger: #C1483B;
    --danger-soft: #FBE4E0;
    --focus-ring: #4036CA;
    --shadow-sm: 0 1px 2px rgba(23,19,49,0.06);

  }

  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: var(--primary); }

  .shell { max-width: 1040px; margin: 0 auto; }

  header.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    padding-block: 16px 12px;

  .segmented {

  }
  .segmented button {

  }

  .pill-neutral { background: var(--surface-alt); color: var(--ink-muted); }

  .appt-row {

  }
  .appt-row:last-child { border-bottom: none; }
  .appt-date { font-weight: 700; font-size: 14px; }
  .appt-time { font-size: 12.5px; color: var(--ink-muted); margin-top: 2px; }
  .appt-row-tags { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }

  .section-eyebrow {

  .admin-sidebar button svg { width: 18px; height: 18px; flex-shrink: 0; }

    .admin-bottomnav button.active { color: var(--primary-strong); }
  }

  .plan-features { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; }
  .plan-features li { display: flex; align-items: center; gap: 9px; }
  .check-dot {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    background: var(--success-soft); color: var(--success);
    display: flex; align-items: center; justify-content: center;
  }
  .check-dot-soon { background: var(--surface-alt); color: var(--ink-muted); }

  .check-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-muted); }

  .rule-chip {

  .config-grid { display: grid; grid-template-columns: repeat(2, minmax(140px, 1fr)); gap: 14px; }

  .toast {

<script>
const STORAGE_KEY = 'agendame_proto_state_v4';
const WEEKDAYS_SHORT = ['dom','lun','mar','mié','jué','vie','sáb'];
const WEEKDAYS_LONG = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function addDaysISO(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
}
function dateFromISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function dayOfWeek(iso){ return dateFromISO(iso).getDay(); }
function ymFromISO(iso){ const d = dateFromISO(iso); return { y: d.getFullYear(), m: d.getMonth() }; }
function isoFromYMD(y, m, day){ return `${y}-${pad2(m + 1)}-${pad2(day)}`; }
function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function minutesToTime(mins){ return `${pad2(Math.floor(mins/60))}:${pad2(mins%60)}`; }
function combineDateTime(iso, time){
  const [y,m,d] = iso.split('-').map(Number);
  const [hh,mm] = time.split(':').map(Number);
  return new Date(y, m-1, d, hh, mm, 0, 0);
}
function displayDateShort(iso){ const dt = dateFromISO(iso); return `${WEEKDAYS_SHORT[dt.getDay()]} ${dt.getDate()}`; }
function displayDateLong(iso){ const dt = dateFromISO(iso); return `${WEEKDAYS_LONG[dt.getDay()]} ${dt.getDate()} de ${MONTHS[dt.getMonth()]}`; }
function overlaps(aS, aE, bS, bE){ return timeToMinutes(aS) < timeToMinutes(bE) && timeToMinutes(bS) < timeToMinutes(aE); }
function normalizeDni(raw){ return (raw || '').replace(/\D/g, ''); }
function isValidDni(raw){ const d = normalizeDni(raw); return d.length >= 6 && d.length <= 10; }
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getDemoBusy(iso){
  const t1 = addDaysISO(todayISO(), 1);
  const t3 = addDaysISO(todayISO(), 3);
  if (iso === t1) return [{ start: '10:00', end: '10:45', title: 'Control médico (evento personal)' }];
  if (iso === t3) return [{ start: '16:00', end: '17:00', title: 'Clase de pilates (evento personal)' }];
  return [];
}

function defaultWeekSchedule(){
  return {
    '1': [{ start: '09:00', end: '13:00' }, { start: '15:00', end: '19:00' }],
    '2': [{ start: '09:00', end: '13:00' }, { start: '15:00', end: '19:00' }],
    '3': [{ start: '09:00', end: '13:00' }, { start: '15:00', end: '19:00' }],
    '4': [{ start: '09:00', end: '13:00' }, { start: '15:00', end: '19:00' }],
    '5': [{ start: '09:00', end: '13:00' }, { start: '15:00', end: '19:00' }],
  };
}

function buildDefaultState(){
  const t = todayISO();
  return {
    view: 'admin',
    adminTab: 'inicio',
    includePast: false,
    brand: { name: 'Toki', color: '#473CE0', logo: null },
    account: { name: 'Valentina Rossi', email: 'valentina@toki.app' },
    google: { connected: false, email: 'valentina.rossi.kine@gmail.com' },
    config: { slotMinutes: 45, bufferMinutes: 0, minNoticeHours: 2, windowDays: 21 },
    staff: [

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const def = buildDefaultState();
      parsed.booking = parsed.booking || def.booking;
      if (!parsed.booking.calendarMonth) parsed.booking.calendarMonth = ymFromISO(todayISO());
      if (parsed.booking.rescheduleId === undefined) parsed.booking.rescheduleId = null;
      if (parsed.booking.lastApptId === undefined) parsed.booking.lastApptId = null;
      if (!parsed.brand) parsed.brand = def.brand;
      if (!parsed.account) parsed.account = def.account;
      if (!Array.isArray(parsed.staff) || !parsed.staff.length) parsed.staff = def.staff;
      if (typeof parsed.roundRobinCursor !== 'number') parsed.roundRobinCursor = 0;
      if (typeof parsed.allowClientStaffPick !== 'boolean') parsed.allowClientStaffPick = false;
      if (!parsed.newRule || !parsed.newRule.staffId) parsed.newRule = def.newRule;
      if (typeof parsed.newStaffName !== 'string') parsed.newStaffName = '';
      if (!Array.isArray(parsed.businesses) || !parsed.businesses.length) parsed.businesses = def.businesses;
      if (!parsed.newBusiness) parsed.newBusiness = def.newBusiness;
      if (!parsed.visiblePasswords) parsed.visiblePasswords = {};
      if (!Array.isArray(parsed.superAlerts)) parsed.superAlerts = [];
      if (parsed.adminTab === 'resumen') parsed.adminTab = 'inicio';
      if (!['inicio', 'citas', 'horarios', 'marca', 'cuenta'].includes(parsed.adminTab)) parsed.adminTab = 'inicio';
      parsed.confirmCancelId = null;
      parsed.toast = null;
      return parsed;
    }
  } catch (e) {}
  return buildDefaultState();
}

function hexToRgb(hex){
  let clean = hex.replace('#', '');
  if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
  const num = parseInt(clean, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function rgbToHex(r, g, b){
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
function mixColor(hex, target, weight){
  const c1 = hexToRgb(hex), c2 = hexToRgb(target);
  return rgbToHex(
    c1.r + (c2.r - c1.r) * weight,
    c1.g + (c2.g - c1.g) * weight,
    c1.b + (c2.b - c1.b) * weight
  );
}
function lightenColor(hex, weight){ return mixColor(hex, '#ffffff', weight); }
function darkenColor(hex, weight){ return mixColor(hex, '#000000', weight); }

function getStaffRawSlots(staffMember, iso){
  const dow = String(dayOfWeek(iso));
  const rules = (staffMember.schedule && staffMember.schedule[dow]) || [];
  if (!rules.length) return [];

  const maxDateISO = addDaysISO(todayISO(), state.config.windowDays);
  if (iso > maxDateISO) return [];

  const step = state.config.slotMinutes + state.config.bufferMinutes;
  const now = new Date();
  const minNoticeAt = new Date(now.getTime() + state.config.minNoticeHours * 3600000);

  let candidates = [];
  rules.forEach(r => {
    let cursor = timeToMinutes(r.start);
    const end = timeToMinutes(r.end);
    while (cursor + state.config.slotMinutes <= end) {
      candidates.push({ start: minutesToTime(cursor), end: minutesToTime(cursor + state.config.slotMinutes) });
      cursor += step;
    }
  });

  candidates = candidates.filter(s => combineDateTime(iso, s.start) >= minNoticeAt);

  const busy = state.appointments.filter(a => a.date === iso && a.status === 'CONFIRMED' && a.staffId === staffMember.id);
  candidates = candidates.filter(s => !busy.some(a => overlaps(s.start, s.end, a.start, a.end)));

  if (state.google.connected && staffMember.id === state.staff[0].id) {
    const demo = getDemoBusy(iso);
    candidates = candidates.filter(s => !demo.some(b => overlaps(s.start, s.end, b.start, b.end)));
  }

  return candidates;
}

// Horarios disponibles para un día, excluyendo una cita puntual (útil al reagendar, para
// no descartar el propio turno que se está moviendo como si estuviera "ocupado").
function getAvailableSlots(iso, excludeApptId){
  const originalAppointments = state.appointments;
  if (excludeApptId) state.appointments = state.appointments.filter(a => a.id !== excludeApptId);
  try {
    const seen = new Set();
    const result = [];
    state.staff.forEach(member => {
      getStaffRawSlots(member, iso).forEach(s => {
        if (!seen.has(s.start)) { seen.add(s.start); result.push(s); }
      });
    });
    result.sort((a, b) => a.start.localeCompare(b.start));
    return result;
  } finally {
    state.appointments = originalAppointments;
  }
}

function getStaffAvailableForSlot(iso, start, end, excludeApptId){
  const originalAppointments = state.appointments;
  if (excludeApptId) state.appointments = state.appointments.filter(a => a.id !== excludeApptId);
  try {
    return state.staff.filter(member => getStaffRawSlots(member, iso).some(s => s.start === start && s.end === end));
  } finally {
    state.appointments = originalAppointments;
  }
}

// Asignación round-robin: entre el personal disponible para ese turno, elige el siguiente
// en la rotación (no siempre el primero), para repartir las citas de forma pareja.
function assignStaffRoundRobin(iso, start, end, excludeApptId){
  const available = getStaffAvailableForSlot(iso, start, end, excludeApptId);
  if (!available.length) return null;
  const chosen = available[state.roundRobinCursor % available.length];
  state.roundRobinCursor = (state.roundRobinCursor + 1) % Math.max(state.staff.length, 1);
  return chosen;
}

function confirmBooking(){
  const { dni, name, phone, selectedDate, selectedSlot, rescheduleId } = state.booking;
  if (!selectedSlot) return;

  const stillFree = getAvailableSlots(selectedDate, rescheduleId).some(s => s.start === selectedSlot.start);
  if (!stillFree) {
    state.booking.error = 'Ese horario se acaba de ocupar. Elige otro.';
    state.booking.selectedSlot = null;
    render();
    return;
  }

  const assigned = assignStaffRoundRobin(selectedDate, selectedSlot.start, selectedSlot.end, rescheduleId);
  if (!assigned) {
    // Caso hipotético de doble reserva: no debería pasar porque ya filtramos por disponibilidad,
    // pero si ocurriera (ej. carrera entre dos reservas simultáneas), avisamos al superadmin.
    reportDoubleBookingAlert(selectedDate, selectedSlot, name);
    state.booking.error = 'Ese horario se acaba de ocupar. Elige otro.';
    state.booking.selectedSlot = null;
    render();
    return;
  }

  state.patients[dni] = { name, phone };

  if (rescheduleId) {
    const appt = state.appointments.find(a => a.id === rescheduleId);
    if (appt) {
      appt.date = selectedDate;
      appt.start = selectedSlot.start;
      appt.end = selectedSlot.end;
      appt.staffId = assigned.id;
      appt.staffName = assigned.name;
      appt.rescheduleRequested = false;
      state.booking.lastApptId = appt.id;
    }
  } else {
    const id = 'a' + Date.now();
    state.appointments.push({
      id,
      dni, name, phone,
      date: selectedDate,
      start: selectedSlot.start,
      end: selectedSlot.end,
      status: 'CONFIRMED',
      paid: false,
      staffId: assigned.id,
      staffName: assigned.name,
      rescheduleRequested: false,
    });
    state.booking.lastApptId = id;
  }

  state.booking.step = 'confirmado';
  saveState();
  render();
}

function cleanPhoneForWhatsapp(phone){

}

  if (!member) return;
  if (start >= end) {
    showToast('La hora de inicio debe ser antes que la de fin');

  member.schedule[day] = member.schedule[day] || [];
  member.schedule[day].push({ start, end });

  saveState();

function deleteRule(staffId, day, idx){
  const member = state.staff.find(s => s.id === staffId);
  if (!member) return;
  member.schedule[day].splice(idx, 1);
  saveState();
  render();
}

function addStaffMember(){
  const name = (state.newStaffName || '').trim();

function renderCalendarPicker(b){
  const cal = state.booking.calendarMonth;
  const firstWeekday = new Date(cal.y, cal.m, 1).getDay();
  const totalDays = new Date(cal.y, cal.m + 1, 0).getDate();
  const todayIso = todayISO();
  const maxIso = addDaysISO(todayIso, state.config.windowDays);
  const todayYM = ymFromISO(todayIso);
  const maxYM = ymFromISO(maxIso);

  const prevDisabled = cal.y < todayYM.y || (cal.y === todayYM.y && cal.m <= todayYM.m);
  const nextDisabled = cal.y > maxYM.y || (cal.y === maxYM.y && cal.m >= maxYM.m);

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  const cellsHtml = cells.map(d => {
    if (d === null) return `<div class="calendar-day blank"></div>`;
    const iso = isoFromYMD(cal.y, cal.m, d);
    const isPast = iso < todayIso;
    const isTooFar = iso > maxIso;
    const slotsCount = !isPast && !isTooFar ? getAvailableSlots(iso, b.rescheduleId).length : 0;
    const disabled = isPast || isTooFar || slotsCount === 0;
    const selected = iso === b.selectedDate;
    const isToday = iso === todayIso;
    return `<button type="button" class="calendar-day ${disabled ? 'disabled' : ''} ${selected ? 'selected' : ''} ${isToday ? 'today' : ''}"
      ${disabled ? 'disabled' : `onclick="pickDay('${iso}')"`}>${d}${!disabled ? '<span class="dot"></span>' : ''}</button>`;
  }).join('');

  return `
    <div class="calendar">
      <div class="calendar-header">
        <button type="button" class="calendar-nav" onclick="navCalendar(-1)" ${prevDisabled ? 'disabled' : ''} aria-label="Mes anterior">${iconChevronLeft()}</button>
        <span class="month-label">${MONTHS[cal.m]} ${cal.y}</span>
        <button type="button" class="calendar-nav" onclick="navCalendar(1)" ${nextDisabled ? 'disabled' : ''} aria-label="Mes siguiente">${iconChevronRight()}</button>
      </div>
      <div class="calendar-grid">
        ${WEEKDAYS_SHORT.map(w => `<div class="calendar-weekday">${w}</div>`).join('')}
        ${cellsHtml}
      </div>
    </div>`;
}

  }

  if (b.step === 'confirmado') {
    const a = state.appointments.find(x => x.id === b.lastApptId) || state.appointments[state.appointments.length - 1];
    return `
      <div class="identify-wrap">

            ? `<p class="empty-note">No hay horarios disponibles este día. Prueba otra fecha.</p>`
            : `<div class="slot-grid">${slots.map(s => `
                <button class="slot-btn mono ${b.selectedSlot && b.selectedSlot.start === s.start ? 'selected' : ''}" onclick="pickSlot('${s.start}','${s.end}')">${s.start}</button>

        </div>
      </div>` : ''}`;
}

                    <span class="rule-chip mono">${r.start} – ${r.end}<button onclick="deleteRule('${member.id}', '${d}', ${idx})" aria-label="Eliminar">✕</button></span>
                  `).join('')}
                </div>
              </div>
            `).join('') || `<p class="empty-note">Todavía no configuraste ningún horario para ${escapeHtml(member.name)}.</p>`}
          </div>
        </div>
      `).join('')}
    </div>`;
}

  return `
    <div class="stack">

        <h2 style="font-size:19px;">Marca</h2>

      </div>

      <div class="card stack">
        <div class="field">
          <label for="brand-name">Nombre del negocio</label>

          <label for="brand-color-hex">Color principal</label>
          <div class="row" style="align-items:center;">

              oninput="document.getElementById('brand-color-hex').value = this.value">
            <input id="brand-color-hex" class="mono" style="max-width:110px;" value="${state.brand.color}"

          <div class="row" style="align-items:center;">

              : `<svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <rect width="32" height="32" rx="9" fill="var(--primary)"/>
                  <circle cx="15" cy="17" r="6.5" stroke="#FFFFFF" stroke-width="2.4"/>

  const planFeatures = [
    'Citas y horarios ilimitados',
    'Equipo con asignación automática (round robin)',
    'Recordatorios y reagendado por WhatsApp',
    'Sincronización con Google Calendar',
    'Marca personalizada (color y logo)',
  ];

  return `
    <div class="stack">
      <div>
        <h2 style="font-size:19px;">Mi cuenta</h2>
      </div>

      <div class="card stack">
        <h3 class="section-eyebrow">Perfil</h3>
        <div class="field">
          <label for="acc-name">Nombre</label>
          <input id="acc-name" value="${escapeHtml(acc.name)}">
        </div>
        <div class="field">
          <label for="acc-email">Email de acceso</label>
          <input id="acc-email" type="email" value="${escapeHtml(acc.email)}">
        </div>
        <button class="btn btn-ghost" onclick="saveAccount()">Guardar perfil</button>
      </div>

      <div class="card stack">
        <div class="row" style="justify-content:space-between; align-items:flex-start;">
          <div>
            <h3 class="section-eyebrow" style="margin-bottom:2px;">Tu cuenta</h3>
            <p style="margin:0; font-family:'Sora',sans-serif; font-weight:800; font-size:17px;">Periodo de prueba</p>
          </div>
          <span class="pill pill-neutral">Prueba</span>
        </div>
        <p class="hint" style="margin:0;">Todavía no definimos precios ni planes. Por ahora estás probando Toki sin costo; te avisaremos antes de que eso cambie.</p>
        <ul class="plan-features">
          ${planFeatures.map(f => `<li><span class="check-dot">${iconCheckSmall()}</span>${f}</li>`).join('')}
          <li><span class="check-dot check-dot-soon">${iconCheckSmall()}</span>Que el cliente elija un profesional específico <span class="pill pill-neutral" style="margin-left:6px;">Según plan (próximamente)</span></li>
        </ul>
      </div>

      <div class="card stack">
        <h3 class="section-eyebrow">Seguridad</h3>
        <div class="config-grid">
          <div class="field"><label for="acc-pass-new">Nueva contraseña</label><input id="acc-pass-new" type="password" placeholder="••••••••"></div>
          <div class="field"><label for="acc-pass-confirm">Confirmar contraseña</label><input id="acc-pass-confirm" type="password" placeholder="••••••••"></div>
        </div>
        <button class="btn btn-ghost" onclick="changePassword()">Actualizar contraseña</button>
      </div>
    </div>`;
}

function renderAdminInicio(){
  const todayIso = todayISO();
  const next7Iso = addDaysISO(todayIso, 7);

  const upcoming = state.appointments
    .filter(a => a.status === 'CONFIRMED' && a.date >= todayIso)
    .sort((a, c) => (a.date + a.start).localeCompare(c.date + c.start));
  const todayAppts = upcoming.filter(a => a.date === todayIso);
  const next7Count = upcoming.filter(a => a.date <= next7Iso).length;
  const pendingPayCount = state.appointments.filter(a => a.status === 'CONFIRMED' && !a.paid).length;
  const nextAppt = upcoming[0];

  return `
    <div class="stack">
      <div>
        <h2 style="font-size:19px;">Hola de nuevo</h2>
        <p style="font-size:13.5px; color:var(--ink-muted); margin:4px 0 0;">${displayDateLong(todayIso).replace(/^./, c => c.toUpperCase())}</p>
      </div>

      <div class="stat-grid">
        <div class="stat-tile">
          <span class="stat-value">${todayAppts.length}</span>
          <span class="stat-label">Citas hoy</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value">${next7Count}</span>
          <span class="stat-label">Próximos 7 días</span>
        </div>
        <div class="stat-tile ${pendingPayCount > 0 ? 'stat-tile-warning' : ''}">
          <span class="stat-value">${pendingPayCount}</span>
          <span class="stat-label">Pagos pendientes</span>
        </div>
      </div>

      <div class="card">
        <h3 class="section-eyebrow">Próxima cita</h3>
        ${nextAppt ? `
          <div class="appt-row" style="padding:0; border:none;">
            <div>
              <div class="appt-date">${displayDateLong(nextAppt.date).replace(/^./, c => c.toUpperCase())}</div>
              <div class="appt-time mono">${nextAppt.start} · ${escapeHtml(nextAppt.name)}</div>
            </div>
            <span class="pill ${nextAppt.paid ? 'pill-success' : 'pill-warning'}">${nextAppt.paid ? 'Pagado' : 'Pago pendiente'}</span>
          </div>` : `<p class="empty-note">No tienes citas próximas.</p>`}
      </div>

      ${todayAppts.length > 0 ? `
      <div>
        <h3 style="font-size:15px; margin-bottom:8px;">Agenda de hoy</h3>
        <div class="card" style="padding:0; overflow:hidden;">
          ${todayAppts.map(a => `
            <div class="appt-row">
              <div>
                <div class="appt-date mono">${a.start}</div>
                <div class="appt-time">${escapeHtml(a.name)}</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="pill ${a.paid ? 'pill-success' : 'pill-warning'}">${a.paid ? 'Pagado' : 'Pendiente'}</span>
                <button class="btn btn-ghost btn-sm" style="padding:6px 8px;" onclick="sendReminder('${a.id}')" aria-label="Enviar recordatorio por WhatsApp a ${escapeHtml(a.name)}">${iconChat()}</button>
                <button class="btn btn-ghost btn-sm" style="padding:6px 8px;" onclick="requestReschedule('${a.id}')" aria-label="Solicitar reagendado por WhatsApp a ${escapeHtml(a.name)}">${iconRefresh()}</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>` : ''}
    </div>`;
}

const ADMIN_NAV = [
  { id: 'inicio', label: 'Inicio', icon: iconNavHome },
  { id: 'citas', label: 'Citas', icon: iconNavCalendar },
  { id: 'horarios', label: 'Horarios', icon: iconNavClock },
  { id: 'marca', label: 'Marca', icon: iconNavPalette },
  { id: 'cuenta', label: 'Mi cuenta', icon: iconNavUser },
];

function renderAdminContent(){
  switch (state.adminTab) {
    case 'inicio': return renderAdminInicio();
    case 'citas': return renderAdminCitas();
    case 'horarios': return renderAdminHorarios();
    case 'marca': return renderAdminMarca();
    case 'cuenta': return renderAdminCuenta();
    default: return renderAdminInicio();
  }
}

function renderAdmin(){
  const myBiz = state.businesses.find(b => b.id === 'biz-1');
  if (myBiz && !myBiz.enabled) {
    return `
      <div class="identify-wrap">
        <div class="card" style="text-align:center;">
          <h1 style="font-size:19px;">Cuenta desactivada</h1>
          <p class="sub" style="margin-top:8px;">El superadministrador desactivó temporalmente esta cuenta. Contacta a Toki para reactivarla.</p>
          <button class="btn btn-text" onclick="setView('super')">Ir a Superadmin</button>
        </div>
      </div>`;
  }
  return `
    <div class="admin-shell">
      <nav class="admin-sidebar" aria-label="Secciones del admin">
        ${ADMIN_NAV.map(t => `
          <button class="${state.adminTab === t.id ? 'active' : ''}" onclick="setAdminTab('${t.id}')">
            ${t.icon()}<span>${t.label}</span>
          </button>
        `).join('')}
      </nav>

      <div class="admin-content">${renderAdminContent()}</div>

      <nav class="admin-bottomnav" aria-label="Secciones del admin">
        ${ADMIN_NAV.map(t => `
          <button class="${state.adminTab === t.id ? 'active' : ''}" onclick="setAdminTab('${t.id}')">
            ${t.icon()}<span>${t.label}</span>
          </button>
        `).join('')}
      </nav>
    </div>
  `;
}

function renderSuper(){
  const pending = state.superAlerts.filter(a => a.status === 'pending');
  const resolved = state.superAlerts.filter(a => a.status === 'resolved');
  const nb = state.newBusiness;

  return `
    <div class="stack" style="max-width:860px;">
      <div>
        <h2 style="font-size:19px;">Superadministrador</h2>
        <p style="margin:4px 0 0; font-size:13.5px; color:var(--ink-muted);">Panel interno de Toki: gestiona las cuentas de negocios/administradores y revisa alertas de la plataforma.</p>
      </div>

      <div class="card stack">
        <div class="row" style="justify-content:space-between; align-items:center;">
          <h3 class="section-eyebrow" style="margin:0;">Alertas de la plataforma</h3>
          <button class="btn btn-ghost btn-sm" onclick="simulateDoubleBookingAlert()">Simular alerta de doble reserva</button>
        </div>
        <p class="hint" style="margin:0;">Hoy la disponibilidad ya evita que dos personas reserven el mismo horario. Esto simula el caso hipotético en que, por una carrera entre dos reservas simultáneas, ocurriera igual — para que el superadmin se entere y lo resuelva manualmente.</p>
        ${pending.length === 0 ? `<p class="empty-note">No hay alertas pendientes.</p>` : `
          <div class="stack" style="gap:8px;">
            ${pending.map(a => `
              <div class="appt-row" style="border:1px solid var(--danger-soft); border-radius:12px; padding:12px 14px;">
                <div style="display:flex; align-items:flex-start; gap:10px;">
                  <span style="color:var(--danger); flex-shrink:0; margin-top:1px;">${iconAlert()}</span>
                  <div>
                    <div class="patient-name">${escapeHtml(a.business)}</div>
                    <div class="appt-time" style="margin-top:2px;">${escapeHtml(a.detail)}</div>
                  </div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="resolveAlert('${a.id}')">Marcar resuelta</button>
              </div>
            `).join('')}
          </div>`}
        ${resolved.length > 0 ? `<p class="hint" style="margin:4px 0 0;">${resolved.length} alerta(s) ya resuelta(s).</p>` : ''}
      </div>

      <div class="card stack">
        <h3 class="section-eyebrow" style="margin:0;">Cuentas de negocios / administradores</h3>
        <div class="tablewrap">
          <table class="appts">
            <thead><tr><th>Negocio</th><th>Usuario admin</th><th>Contraseña</th><th>Plan</th><th>Estado</th><th></th></tr></thead>
            <tbody>
              ${state.businesses.map(biz => `
                <tr>
                  <td data-label="Negocio"><div class="patient-name">${escapeHtml(biz.name)}</div></td>
                  <td class="mono" data-label="Usuario admin">${escapeHtml(biz.adminUser)}</td>
                  <td class="mono" data-label="Contraseña">
                    <span style="display:inline-flex; align-items:center; gap:6px;">
                      ${state.visiblePasswords[biz.id] ? escapeHtml(biz.adminPass) : '••••••••'}
                      <button class="btn-text" style="padding:2px;" onclick="togglePasswordVisible('${biz.id}')" aria-label="Mostrar u ocultar contraseña">${iconEye()}</button>
                    </span>
                  </td>
                  <td data-label="Plan"><span class="pill pill-neutral">${escapeHtml(biz.plan)}</span></td>
                  <td data-label="Estado"><span class="pill ${biz.enabled ? 'pill-success' : 'pill-danger'}">${biz.enabled ? 'Activa' : 'Desactivada'}</span></td>
                  <td style="text-align:right; white-space:nowrap;">
                    <button class="btn btn-ghost btn-sm" onclick="toggleBusinessEnabled('${biz.id}')">${biz.enabled ? 'Desactivar' : 'Activar'}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <p class="hint" style="margin:0;">Las cuentas de administrador no tienen registro propio: tú creas el usuario y la contraseña de cada negocio aquí mismo.</p>
      </div>

      <div class="card stack">
        <h3 class="section-eyebrow" style="margin:0;">Crear cuenta de negocio</h3>
        <div class="config-grid">
          <div class="field"><label for="nb-name">Nombre del negocio</label><input id="nb-name" value="${escapeHtml(nb.name)}" oninput="updateNewBusiness('name', this.value)"></div>
          <div class="field"><label for="nb-user">Usuario admin (email)</label><input id="nb-user" value="${escapeHtml(nb.adminUser)}" oninput="updateNewBusiness('adminUser', this.value)"></div>
          <div class="field"><label for="nb-pass">Contraseña temporal</label><input id="nb-pass" value="${escapeHtml(nb.adminPass)}" oninput="updateNewBusiness('adminPass', this.value)"></div>
        </div>
        <button class="btn btn-primary" style="align-self:flex-start;" onclick="createBusinessAccount()">Crear cuenta</button>
      </div>
    </div>`;
}

function render(){
  document.getElementById('tab-paciente').classList.toggle('active', state.view === 'paciente');
  document.getElementById('tab-admin').classList.toggle('active', state.view === 'admin');
  document.getElementById('tab-super').classList.toggle('active', state.view === 'super');
  document.getElementById('view').innerHTML =
    state.view === 'paciente' ? renderPaciente() :
    state.view === 'super' ? renderSuper() :
    renderAdmin();
  renderToast();
}

refreshBrandUI();
render();
</script>

</body></html>
